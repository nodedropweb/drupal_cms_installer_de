langcode:
  js:
    js/langcode.js: {}
  dependencies:
    - core/drupal

installer-translations:
  js:
    js/installer-translations.js: {}
  dependencies:
    - core/drupal
    - core/once
    - drupal_cms_installer_de/langcode

progress-override:
  js:
    js/progress-override.js: {}
  # Bewusst KEINE Abhaengigkeit auf core/drupal.progress: Diese Bibliothek
  # erweitert (ueber drupal_cms_installer_theme/drupal.progress) ohnehin
  # core/drupal.progress und laedt deshalb nach progress.js. Eine zusaetzliche
  # Abhaengigkeit erzeugt einen Kreis und bricht den Installer mit
  # "Allowed memory size exhausted" im LibraryDependencyResolver ab.
  dependencies:
    - core/drupal
    - drupal_cms_installer_de/langcode

dark-mode:
  css:
    theme:
      css/dark-mode.css: {}

typography:
  css:
    theme:
      css/typography.css: {}

animations:
  css:
    theme:
      css/animations.css: {}
  js:
    js/submit-transition.js: {}
  dependencies:
    - core/drupal
    - core/once

vendor-highlight:
  js:
    # Must run after installer-translations, which matches the full
    # "Created by X" string as one text node - splitting it into spans
    # first would break that match.
    js/vendor-highlight.js: {}
  dependencies:
    - core/drupal
    - core/once
    - drupal_cms_installer_de/installer-translations
