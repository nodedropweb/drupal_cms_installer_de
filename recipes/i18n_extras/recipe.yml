name: 'I18N Extras (DE)'
description: 'Aktiviert pb_localizer, yoast_seo_i18n und default_content_locale für mehrsprachige Drupal-CMS-Installationen und stellt den Gin-Admin-Theme-Modus auf automatisch.'
type: 'Drupal CMS'
install:
  - pb_localizer
  - yoast_seo_i18n
  - default_content_locale
  # Wird i.d.R. schon vom Site-Template installiert; hier zusätzlich gelistet,
  # damit die Config-Action unten unabhängig von der Anwendungsreihenfolge
  # der Rezepte funktioniert (gin.settings muss zu dem Zeitpunkt existieren).
  #
  # ACHTUNG: project_browser bewusst NICHT hier auflisten (auch nicht per
  # simpleConfigUpdate-Action konfigurieren) - dieses Rezept wird laut
  # drupal_cms_installer_choose_template() VOR dem gewählten Site-Template
  # eingereiht. Würde project_browser hier installiert, legt Drupal dabei
  # dessen rohe Default-Config (project_browser.admin_settings, u. a.
  # max_selections: null) an, bevor das Site-Template (z. B. haven) seine
  # eigene, vollständige config/project_browser.admin_settings.yml
  # importieren kann - Drupal-Rezepte überschreiben aber keine bereits
  # existierende Config, der Import des Templates wird dann stillschweigend
  # übersprungen. Ergebnis: die Auswahl-Leiste ("Auswählen" + Sammelbutton)
  # taucht statt des direkten Install-Buttons auf, obwohl ein Template
  # gewählt wurde. Alle aktuellen Site-Templates (starter/haven/byte) setzen
  # allow_ui_install ohnehin selbst - dafür braucht es hier keine Ergänzung.
  - gin
config:
  actions:
    gin.settings:
      simpleConfigUpdate:
        enable_darkmode: 'auto'
